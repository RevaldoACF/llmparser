<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1040" height="620" fill="#0d1117"/>
  <text x="520" y="36" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="bold">Tool calls, assembled in real time</text>
  <text x="520" y="60" text-anchor="middle" fill="#8b949e" font-size="14">Argument JSON arrives in tiny fragments. Your function is called only after it is 100% valid.</text>

  <!-- column headers -->
  <text x="240" y="108" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="bold">the API sends fragments</text>
  <text x="620" y="108" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">the parser assembles them</text>
  <text x="910" y="108" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">your code receives one call</text>

  <!-- vertical dashed guides -->
  <line x1="240" y1="122" x2="240" y2="540" stroke="#30363d" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="620" y1="122" x2="620" y2="540" stroke="#30363d" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="910" y1="122" x2="910" y2="540" stroke="#30363d" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- fragment 1 -->
  <rect x="110" y="140" width="260" height="52" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="240" y="162" text-anchor="middle" fill="#8b949e" font-size="11">chunk 1 (name + id arrive first)</text>
  <text x="240" y="182" text-anchor="middle" fill="#e6edf3" font-size="13" font-family="Consolas, monospace">name: "get_weather"</text>

  <!-- fragment 2 -->
  <rect x="110" y="214" width="260" height="52" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="240" y="236" text-anchor="middle" fill="#8b949e" font-size="11">chunk 2 (argument piece 1)</text>
  <text x="240" y="256" text-anchor="middle" fill="#e6edf3" font-size="13" font-family="Consolas, monospace">args: {"city": "Ja"</text>

  <!-- fragment 3 -->
  <rect x="110" y="288" width="260" height="52" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="240" y="310" text-anchor="middle" fill="#8b949e" font-size="11">chunk 3 (argument piece 2)</text>
  <text x="240" y="330" text-anchor="middle" fill="#e6edf3" font-size="13" font-family="Consolas, monospace">args: karta, "unit"</text>

  <!-- fragment 4 -->
  <rect x="110" y="362" width="260" height="52" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="240" y="384" text-anchor="middle" fill="#8b949e" font-size="11">chunk 4 (argument piece 3)</text>
  <text x="240" y="404" text-anchor="middle" fill="#e6edf3" font-size="13" font-family="Consolas, monospace">args: ": "celsius"} + finish</text>

  <!-- arrows from fragments to assembler -->
  <g stroke="#30363d" stroke-width="2">
    <line x1="370" y1="166" x2="498" y2="310"/>
    <line x1="370" y1="240" x2="498" y2="316"/>
    <line x1="370" y1="314" x2="498" y2="322"/>
    <line x1="370" y1="388" x2="498" y2="328"/>
  </g>

  <!-- assembler -->
  <rect x="500" y="270" width="240" height="100" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="620" y="300" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="bold">StreamingToolParser</text>
  <text x="620" y="322" text-anchor="middle" fill="#e6edf3" font-size="12">one slot per tool index,</text>
  <text x="620" y="340" text-anchor="middle" fill="#e6edf3" font-size="12">fragments glued in order,</text>
  <text x="620" y="358" text-anchor="middle" fill="#8b949e" font-size="12">validated on finish</text>

  <!-- validation diamond -->
  <line x1="620" y1="370" x2="620" y2="410" stroke="#30363d" stroke-width="2"/>
  <polygon points="620,412 740,462 620,512 500,462" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="620" y="458" text-anchor="middle" fill="#e6edf3" font-size="13">is the JSON</text>
  <text x="620" y="474" text-anchor="middle" fill="#e6edf3" font-size="13">complete and valid?</text>

  <!-- no branch: error -->
  <line x1="500" y1="462" x2="420" y2="462" stroke="#30363d" stroke-width="2"/>
  <polygon points="416,462 428,456 428,468" fill="#8b949e"/>
  <text x="452" y="452" text-anchor="middle" fill="#8b949e" font-size="12">no</text>
  <rect x="240" y="436" width="180" height="52" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="330" y="458" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">error event</text>
  <text x="330" y="476" text-anchor="middle" fill="#8b949e" font-size="11">tool_arguments_invalid</text>

  <!-- yes branch: emit -->
  <line x1="740" y1="462" x2="810" y2="462" stroke="#30363d" stroke-width="2"/>
  <polygon points="814,462 802,456 802,468" fill="#8b949e"/>
  <text x="770" y="452" text-anchor="middle" fill="#8b949e" font-size="12">yes</text>
  <rect x="814" y="424" width="210" height="76" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2.5"/>
  <text x="919" y="450" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">tool_call_complete</text>
  <text x="919" y="472" text-anchor="middle" fill="#e6edf3" font-size="12" font-family="Consolas, monospace">get_weather({</text>
  <text x="919" y="488" text-anchor="middle" fill="#e6edf3" font-size="12" font-family="Consolas, monospace">  city: "Jakarta", unit: "celsius"})</text>

  <!-- bottom notes -->
  <rect x="110" y="548" width="420" height="52" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="570" text-anchor="middle" fill="#8b949e" font-size="12">Parallel calls are safe: every tool gets its own slot</text>
  <text x="320" y="588" text-anchor="middle" fill="#8b949e" font-size="12">(keyed by index), so interleaved fragments never mix.</text>

  <rect x="560" y="548" width="370" height="52" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="745" y="570" text-anchor="middle" fill="#8b949e" font-size="12">While it is still streaming you can show a live preview</text>
  <text x="745" y="588" text-anchor="middle" fill="#8b949e" font-size="12">with partialJson, e.g. {"city": "Ja"} → {"city": "Ja", ...}.</text>
</svg>