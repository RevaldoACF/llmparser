<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1f2328" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1120" height="640" fill="#f6f8fa"/>
  <rect x="16" y="12" width="1088" height="616" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="560" y="50" text-anchor="middle" fill="#1f2328" font-size="22" font-weight="bold">Tool calls, assembled in real time</text>
  <text x="560" y="74" text-anchor="middle" fill="#57606a" font-size="14">Argument JSON arrives in tiny fragments. Your function is called only after the JSON is 100% valid.</text>

  <!-- column headers -->
  <text x="220" y="112" text-anchor="middle" fill="#bc4c00" font-size="14" font-weight="bold">the API sends fragments</text>
  <text x="600" y="112" text-anchor="middle" fill="#0969da" font-size="14" font-weight="bold">the parser assembles them</text>
  <text x="950" y="112" text-anchor="middle" fill="#1a7f37" font-size="14" font-weight="bold">your code receives one call</text>

  <!-- vertical dashed guides -->
  <g stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 6">
    <line x1="220" y1="126" x2="220" y2="540"/>
    <line x1="600" y1="126" x2="600" y2="540"/>
    <line x1="950" y1="126" x2="950" y2="540"/>
  </g>

  <!-- fragment 1 -->
  <rect x="80" y="146" width="280" height="52" rx="8" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="220" y="166" text-anchor="middle" fill="#57606a" font-size="11">chunk 1: name and id arrive first</text>
  <text x="220" y="186" text-anchor="middle" fill="#1f2328" font-size="13" font-family="SFMono-Regular, Consolas, Menlo, monospace">name: "get_weather"</text>

  <!-- fragment 2 -->
  <rect x="80" y="220" width="280" height="52" rx="8" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="220" y="240" text-anchor="middle" fill="#57606a" font-size="11">chunk 2: argument piece 1</text>
  <text x="220" y="260" text-anchor="middle" fill="#1f2328" font-size="13" font-family="SFMono-Regular, Consolas, Menlo, monospace">{"city": "Ja</text>

  <!-- fragment 3 -->
  <rect x="80" y="294" width="280" height="52" rx="8" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="220" y="314" text-anchor="middle" fill="#57606a" font-size="11">chunk 3: argument piece 2</text>
  <text x="220" y="334" text-anchor="middle" fill="#1f2328" font-size="13" font-family="SFMono-Regular, Consolas, Menlo, monospace">karta, "unit"</text>

  <!-- fragment 4 -->
  <rect x="80" y="368" width="280" height="52" rx="8" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="220" y="388" text-anchor="middle" fill="#57606a" font-size="11">chunk 4: argument piece 3 + finish</text>
  <text x="220" y="408" text-anchor="middle" fill="#1f2328" font-size="13" font-family="SFMono-Regular, Consolas, Menlo, monospace">": "celsius"}</text>

  <!-- arrows from fragments to the assembler -->
  <g stroke="#8c959f" stroke-width="2">
    <line x1="360" y1="172" x2="472" y2="288"/>
    <line x1="360" y1="246" x2="470" y2="310"/>
    <line x1="360" y1="320" x2="468" y2="331"/>
    <line x1="360" y1="394" x2="469" y2="353"/>
  </g>
  <g fill="#8c959f">
    <polygon points="480,296 468,290 470,302" transform="rotate(45.9 480 296)"/>
    <polygon points="480,316 468,310 470,322" transform="rotate(30.3 480 316)"/>
    <polygon points="480,332 468,326 470,338" transform="rotate(5.7 480 332)"/>
    <polygon points="480,348 468,342 470,354" transform="rotate(-20.9 480 348)"/>
  </g>

  <!-- assembler -->
  <rect x="480" y="264" width="240" height="112" rx="12" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/>
  <text x="600" y="294" text-anchor="middle" fill="#0969da" font-size="15" font-weight="bold">StreamingToolParser</text>
  <text x="600" y="318" text-anchor="middle" fill="#1f2328" font-size="12">one slot per tool index,</text>
  <text x="600" y="336" text-anchor="middle" fill="#1f2328" font-size="12">fragments glued in order,</text>
  <text x="600" y="354" text-anchor="middle" fill="#57606a" font-size="12">validated on finish</text>

  <!-- down to validation -->
  <line x1="600" y1="376" x2="600" y2="406" stroke="#8c959f" stroke-width="2"/>
  <polygon points="600,414 594,402 606,402" fill="#8c959f"/>

  <!-- validation diamond -->
  <polygon points="600,414 730,464 600,514 470,464" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="600" y="458" text-anchor="middle" fill="#1f2328" font-size="13">is the JSON</text>
  <text x="600" y="476" text-anchor="middle" fill="#1f2328" font-size="13">complete and valid?</text>

  <!-- no branch: error -->
  <line x1="470" y1="464" x2="420" y2="464" stroke="#8c959f" stroke-width="2"/>
  <polygon points="410,464 422,458 422,470" fill="#8c959f"/>
  <text x="442" y="454" text-anchor="middle" fill="#57606a" font-size="12">no</text>
  <rect x="205" y="438" width="200" height="52" rx="10" fill="#f6f8fa" stroke="#cf222e" stroke-width="2"/>
  <text x="305" y="460" text-anchor="middle" fill="#cf222e" font-size="13" font-weight="bold">error event</text>
  <text x="305" y="478" text-anchor="middle" fill="#57606a" font-size="11">tool_arguments_invalid</text>

  <!-- yes branch: emit -->
  <line x1="730" y1="464" x2="768" y2="464" stroke="#8c959f" stroke-width="2"/>
  <polygon points="780,464 768,458 768,470" fill="#8c959f"/>
  <text x="750" y="454" text-anchor="middle" fill="#57606a" font-size="12">yes</text>
  <rect x="780" y="426" width="290" height="80" rx="12" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2.5"/>
  <text x="925" y="452" text-anchor="middle" fill="#1a7f37" font-size="14" font-weight="bold">tool_call_complete</text>
  <text x="925" y="474" text-anchor="middle" fill="#1f2328" font-size="12" font-family="SFMono-Regular, Consolas, Menlo, monospace">get_weather({</text>
  <text x="925" y="492" text-anchor="middle" fill="#1f2328" font-size="12" font-family="SFMono-Regular, Consolas, Menlo, monospace">  city: "Jakarta", unit: "celsius"})</text>

  <!-- bottom notes -->
  <rect x="80" y="556" width="480" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="320" y="580" text-anchor="middle" fill="#57606a" font-size="12">Parallel calls are safe: every tool index gets its own</text>
  <text x="320" y="598" text-anchor="middle" fill="#57606a" font-size="12">slot, so interleaved fragments never mix.</text>

  <rect x="590" y="556" width="450" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="815" y="580" text-anchor="middle" fill="#57606a" font-size="12">While arguments are still streaming, partialJson gives a</text>
  <text x="815" y="598" text-anchor="middle" fill="#57606a" font-size="12">live, display only preview of the slot.</text>
</svg>