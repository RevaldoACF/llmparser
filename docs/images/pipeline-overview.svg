<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1f2328" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1120" height="400" fill="#f6f8fa"/>
  <rect x="16" y="12" width="1088" height="376" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="560" y="54" text-anchor="middle" fill="#1f2328" font-size="22" font-weight="bold">How llmstream works</text>
  <text x="560" y="78" text-anchor="middle" fill="#57606a" font-size="14">Raw LLM stream in. Clean, complete sentences out.</text>

  <!-- arrows between boxes -->
  <g stroke="#8c959f" stroke-width="2">
    <line x1="222" y1="205" x2="240" y2="205"/>
    <line x1="432" y1="205" x2="450" y2="205"/>
    <line x1="642" y1="205" x2="660" y2="205"/>
    <line x1="852" y1="205" x2="870" y2="205"/>
  </g>
  <g fill="#8c959f">
    <polygon points="250,205 238,199 238,211"/>
    <polygon points="460,205 448,199 448,211"/>
    <polygon points="670,205 658,199 658,211"/>
    <polygon points="880,205 868,199 868,211"/>
  </g>

  <!-- box 1: raw stream -->
  <rect x="40" y="120" width="180" height="170" rx="12" fill="#f6f8fa" stroke="#bc4c00" stroke-width="2"/>
  <text x="130" y="152" text-anchor="middle" fill="#bc4c00" font-size="15" font-weight="bold">1. Raw stream</text>
  <text x="130" y="182" text-anchor="middle" fill="#1f2328" font-size="12">bytes from the API</text>
  <text x="130" y="202" text-anchor="middle" fill="#57606a" font-size="11">OpenAI, Anthropic, Gemini,</text>
  <text x="130" y="218" text-anchor="middle" fill="#57606a" font-size="11">Groq, Ollama, OpenRouter</text>
  <text x="130" y="262" text-anchor="middle" fill="#0550ae" font-size="11" font-family="SFMono-Regular, Consolas, Menlo, monospace">data: { ... }</text>

  <!-- box 2: wire decoder -->
  <rect x="250" y="120" width="180" height="170" rx="12" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/>
  <text x="340" y="152" text-anchor="middle" fill="#0969da" font-size="15" font-weight="bold">2. Wire decoder</text>
  <text x="340" y="182" text-anchor="middle" fill="#1f2328" font-size="12">SSE or JSON Lines</text>
  <text x="340" y="202" text-anchor="middle" fill="#57606a" font-size="11">handles chunks split</text>
  <text x="340" y="218" text-anchor="middle" fill="#57606a" font-size="11">mid word or mid UTF-8</text>
  <text x="340" y="262" text-anchor="middle" fill="#0550ae" font-size="11" font-family="SFMono-Regular, Consolas, Menlo, monospace">{ ... } valid JSON</text>

  <!-- box 3: provider adapter -->
  <rect x="460" y="120" width="180" height="170" rx="12" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/>
  <text x="550" y="152" text-anchor="middle" fill="#8250df" font-size="15" font-weight="bold">3. Provider adapter</text>
  <text x="550" y="182" text-anchor="middle" fill="#1f2328" font-size="12">one event format:</text>
  <text x="550" y="202" text-anchor="middle" fill="#57606a" font-size="11">text, reasoning, tools,</text>
  <text x="550" y="218" text-anchor="middle" fill="#57606a" font-size="11">usage, metadata, errors</text>
  <text x="550" y="262" text-anchor="middle" fill="#0550ae" font-size="11" font-family="SFMono-Regular, Consolas, Menlo, monospace">{ type: "delta" }</text>

  <!-- box 4: sentence buffer -->
  <rect x="670" y="120" width="180" height="170" rx="12" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/>
  <text x="760" y="152" text-anchor="middle" fill="#1a7f37" font-size="15" font-weight="bold">4. Sentence buffer</text>
  <text x="760" y="182" text-anchor="middle" fill="#1f2328" font-size="12">waits for a full sentence,</text>
  <text x="760" y="202" text-anchor="middle" fill="#57606a" font-size="11">then cleans it: no</text>
  <text x="760" y="218" text-anchor="middle" fill="#57606a" font-size="11">markdown, no emoji</text>
  <text x="760" y="262" text-anchor="middle" fill="#0550ae" font-size="11" font-family="SFMono-Regular, Consolas, Menlo, monospace">"The sky is blue."</text>

  <!-- box 5: sentences out -->
  <rect x="880" y="120" width="180" height="170" rx="12" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/>
  <text x="970" y="152" text-anchor="middle" fill="#9a6700" font-size="15" font-weight="bold">5. Sentences out</text>
  <text x="970" y="182" text-anchor="middle" fill="#1f2328" font-size="12">complete, clean text</text>
  <text x="970" y="202" text-anchor="middle" fill="#57606a" font-size="11">for a chat UI, captions,</text>
  <text x="970" y="218" text-anchor="middle" fill="#57606a" font-size="11">search, TTS, or storage</text>

  <!-- bottom note -->
  <rect x="40" y="320" width="1040" height="48" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="560" y="341" text-anchor="middle" fill="#1f2328" font-size="13">Everything runs in one call: parse_stream() in Python, parseStream() in JavaScript.</text>
  <text x="560" y="359" text-anchor="middle" fill="#57606a" font-size="13">The provider is detected automatically, so you normally write zero configuration.</text>
</svg>