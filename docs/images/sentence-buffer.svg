<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1f2328" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1120" height="920" fill="#f6f8fa"/>
  <rect x="16" y="12" width="1088" height="896" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="560" y="52" text-anchor="middle" fill="#1f2328" font-size="22" font-weight="bold">The sentence buffer, step by step</text>
  <text x="560" y="76" text-anchor="middle" fill="#57606a" font-size="14">Text is held in a buffer and released only when it is complete and safe to use</text>

  <!-- main vertical connectors -->
  <g stroke="#8c959f" stroke-width="2" fill="none">
    <line x1="380" y1="136" x2="380" y2="154"/>
    <line x1="380" y1="212" x2="380" y2="230"/>
    <line x1="380" y1="332" x2="380" y2="350"/>
    <line x1="380" y1="456" x2="380" y2="474"/>
    <line x1="380" y1="576" x2="380" y2="594"/>
    <line x1="380" y1="696" x2="380" y2="714"/>
    <line x1="380" y1="776" x2="380" y2="794"/>
    <!-- yes branches to the hold/handle boxes -->
    <line x1="500" y1="284" x2="612" y2="284"/>
    <line x1="500" y1="408" x2="612" y2="408"/>
    <line x1="500" y1="528" x2="612" y2="528"/>
    <line x1="500" y1="648" x2="612" y2="648"/>
  </g>
  <g fill="#8c959f">
    <polygon points="380,162 374,150 386,150"/>
    <polygon points="380,236 374,224 386,224"/>
    <polygon points="380,358 374,346 386,346"/>
    <polygon points="380,482 374,470 386,470"/>
    <polygon points="380,602 374,590 386,590"/>
    <polygon points="380,720 374,708 386,708"/>
    <polygon points="380,800 374,788 386,788"/>
    <polygon points="620,284 608,278 608,290"/>
    <polygon points="620,408 608,402 608,414"/>
    <polygon points="620,528 608,522 608,534"/>
    <polygon points="620,648 608,642 608,654"/>
  </g>

  <!-- branch labels -->
  <g fill="#57606a" font-size="12">
    <text x="536" y="276">yes</text>
    <text x="536" y="400">yes</text>
    <text x="536" y="520">no</text>
    <text x="536" y="640">no</text>
    <text x="392" y="326">no</text>
    <text x="392" y="448">no</text>
    <text x="392" y="568">yes</text>
    <text x="392" y="688">yes</text>
  </g>

  <!-- start -->
  <rect x="280" y="92" width="200" height="44" rx="22" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="380" y="119" text-anchor="middle" fill="#1f2328" font-size="14" font-weight="bold">new text arrives</text>

  <!-- add to buffer -->
  <rect x="280" y="164" width="200" height="48" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/>
  <text x="380" y="193" text-anchor="middle" fill="#1a7f37" font-size="14" font-weight="bold">add to buffer</text>

  <!-- D1 tag guard -->
  <polygon points="380,236 500,284 380,332 260,284" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="380" y="278" text-anchor="middle" fill="#1f2328" font-size="13">ends in a partial</text>
  <text x="380" y="296" text-anchor="middle" fill="#1f2328" font-size="13">tag or fence?</text>
  <rect x="620" y="256" width="420" height="56" rx="10" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/>
  <text x="830" y="278" text-anchor="middle" fill="#9a6700" font-size="13" font-weight="bold">hold (tag guard)</text>
  <text x="830" y="298" text-anchor="middle" fill="#57606a" font-size="12">wait until the tag or fence is complete, then continue</text>
  <path d="M 1040 284 H 1076 V 188 H 492" stroke="#8c959f" stroke-width="2" fill="none" opacity="0.55"/>
  <polygon points="482,188 494,182 494,194" fill="#8c959f" opacity="0.55"/>
  <text x="1066" y="240" text-anchor="middle" fill="#57606a" font-size="11" opacity="0.8">loop</text>

  <!-- D2 code block -->
  <polygon points="380,360 500,408 380,456 260,408" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="380" y="402" text-anchor="middle" fill="#1f2328" font-size="13">inside a</text>
  <text x="380" y="420" text-anchor="middle" fill="#1f2328" font-size="13">code block?</text>
  <rect x="620" y="380" width="420" height="56" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/>
  <text x="830" y="402" text-anchor="middle" fill="#1a7f37" font-size="13" font-weight="bold">handle the code block as a unit</text>
  <text x="830" y="422" text-anchor="middle" fill="#57606a" font-size="12">passthrough, drop, or replace with the word (code)</text>

  <!-- D3 sentence found -->
  <polygon points="380,480 500,528 380,576 260,528" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="380" y="522" text-anchor="middle" fill="#1f2328" font-size="13">complete sentence</text>
  <text x="380" y="540" text-anchor="middle" fill="#1f2328" font-size="13">found?</text>
  <rect x="620" y="496" width="420" height="64" rx="10" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/>
  <text x="830" y="518" text-anchor="middle" fill="#9a6700" font-size="13" font-weight="bold">hold, wait for more text</text>
  <text x="830" y="536" text-anchor="middle" fill="#57606a" font-size="12">an ender is real only when it is not part of an</text>
  <text x="830" y="552" text-anchor="middle" fill="#57606a" font-size="12">abbreviation (Mr.) or a decimal (3.14)</text>

  <!-- D4 min size -->
  <polygon points="380,600 500,648 380,696 260,648" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="380" y="642" text-anchor="middle" fill="#1f2328" font-size="13">at least 40</text>
  <text x="380" y="660" text-anchor="middle" fill="#1f2328" font-size="13">codepoints?</text>
  <rect x="620" y="620" width="420" height="56" rx="10" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/>
  <text x="830" y="642" text-anchor="middle" fill="#9a6700" font-size="13" font-weight="bold">hold, too short to emit</text>
  <text x="830" y="662" text-anchor="middle" fill="#57606a" font-size="12">merge with the next sentence, so no tiny fragments go out</text>

  <!-- clean up -->
  <rect x="280" y="720" width="200" height="56" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/>
  <text x="380" y="742" text-anchor="middle" fill="#1a7f37" font-size="13" font-weight="bold">clean it up</text>
  <text x="380" y="760" text-anchor="middle" fill="#57606a" font-size="11">remove markdown, emoji, extra spaces</text>

  <!-- emit -->
  <rect x="240" y="800" width="280" height="56" rx="10" fill="#f6f8fa" stroke="#9a6700" stroke-width="3"/>
  <text x="380" y="822" text-anchor="middle" fill="#9a6700" font-size="15" font-weight="bold">EMIT sentence</text>
  <text x="380" y="842" text-anchor="middle" fill="#57606a" font-size="11">complete, clean text, ready to use</text>

  <!-- safety net note -->
  <rect x="620" y="792" width="420" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="830" y="816" text-anchor="middle" fill="#57606a" font-size="12">Safety net: if the buffer reaches 400 codepoints</text>
  <text x="830" y="834" text-anchor="middle" fill="#57606a" font-size="12">with no valid boundary, it is force flushed, so</text>
  <text x="830" y="852" text-anchor="middle" fill="#1f2328" font-size="12" font-weight="bold">output never has to wait indefinitely.</text>
</svg>