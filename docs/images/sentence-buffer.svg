<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="780" viewBox="0 0 1060 780" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1060" height="780" fill="#0d1117"/>
  <text x="530" y="38" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="bold">The sentence buffer, step by step</text>
  <text x="530" y="62" text-anchor="middle" fill="#8b949e" font-size="14">Text is held in a buffer and released only when it is safe to speak</text>

  <!-- ===== arrows (main flow) ===== -->
  <g stroke="#30363d" stroke-width="2" fill="none">
    <line x1="330" y1="104" x2="330" y2="130"/>
    <line x1="330" y1="186" x2="330" y2="212"/>
    <line x1="330" y1="308" x2="330" y2="334"/>
    <line x1="330" y1="430" x2="330" y2="456"/>
    <line x1="330" y1="552" x2="330" y2="578"/>
    <line x1="330" y1="674" x2="330" y2="700"/>
    <!-- decision "yes" branches (downward) -->
    <line x1="430" y1="260" x2="640" y2="260"/>
    <line x1="430" y1="382" x2="640" y2="382"/>
    <line x1="430" y1="626" x2="640" y2="626"/>
    <!-- decision "no" branches (downward along main line already) -->
  </g>
  <g fill="#8b949e">
    <polygon points="330,134 324,122 336,122"/>
    <polygon points="330,216 324,204 336,204"/>
    <polygon points="330,338 324,326 336,326"/>
    <polygon points="330,460 324,448 336,448"/>
    <polygon points="330,582 324,570 336,570"/>
    <polygon points="330,704 324,692 336,692"/>
    <polygon points="644,260 632,254 632,266"/>
    <polygon points="644,382 632,376 632,388"/>
    <polygon points="644,626 632,620 632,632"/>
  </g>

  <!-- yes labels -->
  <g fill="#8b949e" font-size="12">
    <text x="500" y="252">yes</text>
    <text x="500" y="374">yes</text>
    <text x="500" y="618">yes</text>
  </g>
  <!-- no labels (next to main line) -->
  <g fill="#8b949e" font-size="12">
    <text x="340" y="330">no</text>
    <text x="340" y="452">no</text>
    <text x="340" y="574">no</text>
  </g>

  <!-- ===== start ===== -->
  <rect x="230" y="82" width="200" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="330" y="109" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">new text arrives</text>

  <!-- buffer add -->
  <rect x="230" y="138" width="200" height="48" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="330" y="167" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">add to buffer</text>

  <!-- D1 tag guard -->
  <polygon points="330,216 430,260 330,304 230,260" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="330" y="256" text-anchor="middle" fill="#e6edf3" font-size="13">ends in a partial</text>
  <text x="330" y="272" text-anchor="middle" fill="#e6edf3" font-size="13">tag or fence?</text>
  <rect x="644" y="234" width="330" height="52" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="809" y="256" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">HOLD (tag guard)</text>
  <text x="809" y="274" text-anchor="middle" fill="#8b949e" font-size="12">wait until the tag or fence is complete, then continue</text>
  <path d="M 974 260 H 1020 V 160 H 436" stroke="#30363d" stroke-width="2" fill="none"/>
  <polygon points="436,160 448,154 448,166" fill="#8b949e"/>
  <text x="1000" y="220" fill="#6e7681" font-size="11" text-anchor="middle">loop</text>

  <!-- D2 code block -->
  <polygon points="330,338 430,382 330,426 230,382" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="330" y="388" text-anchor="middle" fill="#e6edf3" font-size="13">inside a code block?</text>
  <rect x="644" y="356" width="330" height="52" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="809" y="378" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">emit the code block</text>
  <text x="809" y="396" text-anchor="middle" fill="#8b949e" font-size="12">as-is, or drop it, or replace with "(code)" (your choice)</text>
  <path d="M 974 382 H 1020 V 160 H 436" stroke="#30363d" stroke-width="2" fill="none" opacity="0.35"/>

  <!-- D3 sentence found -->
  <polygon points="330,460 430,504 330,548 230,504" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="330" y="496" text-anchor="middle" fill="#e6edf3" font-size="13">complete sentence</text>
  <text x="330" y="512" text-anchor="middle" fill="#e6edf3" font-size="13">found?</text>
  <text x="330" y="528" text-anchor="middle" fill="#6e7681" font-size="10">(an ender like . ! ? … that is not</text>
  <text x="330" y="540" text-anchor="middle" fill="#6e7681" font-size="10">an abbreviation or a decimal number)</text>
  <rect x="644" y="478" width="330" height="52" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="809" y="500" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">HOLD, wait for more text</text>
  <text x="809" y="518" text-anchor="middle" fill="#8b949e" font-size="12">unless the stream goes quiet, then flush (idle timeout)</text>
  <path d="M 974 504 H 1020 V 160 H 436" stroke="#30363d" stroke-width="2" fill="none" opacity="0.25"/>

  <!-- D4 min size -->
  <polygon points="330,582 430,626 330,670 230,626" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="330" y="622" text-anchor="middle" fill="#e6edf3" font-size="13">at least 40</text>
  <text x="330" y="638" text-anchor="middle" fill="#e6edf3" font-size="13">codepoints?</text>
  <rect x="644" y="600" width="330" height="52" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="809" y="622" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">HOLD, too short to speak</text>
  <text x="809" y="640" text-anchor="middle" fill="#8b949e" font-size="12">merge with the next sentence so TTS sounds natural</text>
  <path d="M 974 626 H 1020 V 160 H 436" stroke="#30363d" stroke-width="2" fill="none" opacity="0.2"/>

  <!-- clean up -->
  <rect x="230" y="708" width="200" height="48" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="330" y="729" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">clean it up</text>
  <text x="330" y="746" text-anchor="middle" fill="#8b949e" font-size="11">remove markdown, emoji, extra spaces</text>

  <!-- EMIT -->
  <rect x="470" y="708" width="260" height="48" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="3"/>
  <text x="600" y="730" text-anchor="middle" fill="#e3b341" font-size="15" font-weight="bold">EMIT sentence</text>
  <text x="600" y="747" text-anchor="middle" fill="#8b949e" font-size="11">ready for TTS, captions, or a chat UI</text>
  <line x1="430" y1="732" x2="466" y2="732" stroke="#30363d" stroke-width="2"/>
  <polygon points="470,732 458,726 458,738" fill="#8b949e"/>

  <!-- max size note -->
  <rect x="790" y="700" width="250" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="915" y="724" text-anchor="middle" fill="#8b949e" font-size="12">Safety net: if the buffer reaches 400</text>
  <text x="915" y="742" text-anchor="middle" fill="#8b949e" font-size="12">codepoints with no sentence, it is</text>
  <text x="915" y="758" text-anchor="middle" fill="#e3b341" font-size="12">force-flushed so it never piles up.</text>
</svg>
